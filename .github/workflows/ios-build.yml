name: iOS build (unsigned)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - uses: actions/setup-dotnet@v4
        id: setup-dotnet
        with:
          dotnet-version: '9.0.x'

      - name: Pin SDK version (runner also ships a newer preinstalled SDK)
        working-directory: src
        run: |
          cat > global.json <<EOF
          {
            "sdk": {
              "version": "${{ steps.setup-dotnet.outputs.dotnet-version }}",
              "rollForward": "latestFeature"
            }
          }
          EOF
          cat global.json
          dotnet --version

      - name: Restore MAUI workloads
        working-directory: src
        run: dotnet workload restore MakeReady.csproj

      - name: Build unsigned iOS app bundle
        working-directory: src
        run: >
          dotnet build MakeReady.csproj
          -f net9.0-ios
          -c Release
          -r ios-arm64
          --self-contained
          -p:CodesignKey=
          -p:CodesignProvision=
          -p:BuildIpa=false
          -p:ArchiveOnBuild=false

      - name: Find .app bundle
        working-directory: src
        run: find bin/Release/net9.0-ios -maxdepth 2 -name "*.app" -print

      - name: Package into IPA
        working-directory: src
        run: |
          APP_PATH=$(find bin/Release/net9.0-ios -maxdepth 2 -name "*.app" | head -1)
          echo "App bundle: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r MakeReady-unsigned.ipa Payload
          mv MakeReady-unsigned.ipa "$GITHUB_WORKSPACE/"

      - uses: actions/upload-artifact@v4
        with:
          name: MakeReady-unsigned-ipa
          path: MakeReady-unsigned.ipa
